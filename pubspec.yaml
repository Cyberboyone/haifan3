name: haifan_tafsir
description: Offline audio lessons app for Shaikh Abdurrazaq Yahaya Haifan - Tafsir.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio playback (offline)
  just_audio: ^0.9.40

  # Local persistence for streaks / progress / saved clips
  shared_preferences: ^2.2.3

  cupertino_icons: ^1.0.6
  just_audio_background: ^0.0.1-beta.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/scholar_haifan.jpg"
  adaptive_icon_background: "#0D1B2A"
  adaptive_icon_foreground: "assets/images/scholar_haifan.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/audio/
